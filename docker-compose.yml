services:
  backend:
    build:
      context: ./pdf-watermarker
      dockerfile: Dockerfile
    environment:
    - FLASK_ENV=development
    - PYTHONUNBUFFERED=1
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/health || exit 1
      timeout: 10s
    ports:
    - ${BACKEND_PORT:-5000}:5000
    volumes:
    - ./pdf-watermarker:/app
version: '3.8'
